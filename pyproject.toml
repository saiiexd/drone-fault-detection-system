[project]
name = "aeropulse"
version = "0.1.0"
description = "Real-time drone fault detection from PX4 flight logs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sai Venkat" }]
keywords = ["px4", "drone", "uav", "fault-detection", "anomaly-detection", "mavlink", "gazebo"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyulog",
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "duckdb",
    "scikit-learn",
    "joblib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeropulse"]

[dependency-groups]
dev = [
    "pytest",
    "ipykernel",
    "ruff>=0.17.4",
]
orchestration = [
    "dagster",
    "dagster-webserver",
]
sim = [
    "mavsdk",
]
stream = [
    "fastapi",
    "pymavlink",
    "uvicorn",
]

[tool.uv]
default-groups = ["dev", "orchestration", "sim", "stream"]

[tool.dagster]
module_name = "aeropulse.orchestration.definitions"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
